[package]
name = "dizmo_editor"
version.workspace = true
edition.workspace = true
# Ensure the icon source and Windows resource script ship with the crate so
# CI (and local Windows builds) can embed the icon into the executable.
include = ["src/**/*", "resources/**/*", "build.rs"]

[dependencies]
ardftsrc = { version = "0.0.16", features = ["rayon"] }
dizmo_kit = { path = "../dizmo_kit" }
futures = "0.3"
hound = "3.5.1"
iced = "0.14.0"
rfd = "0.17.2"
rodio = "0.22.2"
roxmltree = "0.21.1"

[build-dependencies]
embed-resource = "3"
