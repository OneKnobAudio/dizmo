[package]
name = "dizmo"
version.workspace = true
edition.workspace = true

[dependencies]
dizmo_kit = { path = "../dizmo_kit" }
nice-plug = "0.2.3"
# `smol` enables iced's `time::every` subscription, which drives the trigger
# blink and level LED animations; the `canvas` feature is required for the
# iced_audio widgets and `image` for their renderer support.
nice-plug-iced = { version = "0.2.0", features = ["canvas", "image", "smol"] }
iced_audio = { version = "0.15.0", features = ["nice-plug"] }
# Direct access to `iced_futures::backend::default::time::every`, the 40 ms
# ticker that drives the trigger blink and level LED animations. The `smol`
# feature is enabled transitively via nice-plug-iced above.
iced_futures = "0.14"
thiserror = "2"
hound = "3.5"
crossbeam-channel = "0.5"
ardftsrc = { version = "0.0.16", features = ["rayon"] }

[lib]
crate-type = ["cdylib", "lib"]
