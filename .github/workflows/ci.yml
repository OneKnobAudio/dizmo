name: CI

on:
  push:
    branches: ["**"]
    # The `package`, `editor-package` and `release` jobs only run when a version tag is pushed.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The steps below use bash-isms (arrays, brace expansion) that the default
    # dash shell on Ubuntu does not support.
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and test once on a single platform; packaging depends on this passing.
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  # Build and bundle the plugins into CLAP and VST3 bundles. Both plugin
  # variants (DIZMO and DIZMO Multi) share one cdylib, so each package from
  # `bundler.toml` yields a single CLAP and a single VST3 bundle.
  #
  # Bundles are only generated when a version tag (`v*`) is pushed; branch
  # pushes and pull requests only run the `test` job.
  package:
    name: Package ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: both architectures are built and merged into a universal
          # binary with `cargo xtask bundle-universal`. CI runners are ARM64,
          # so the x86_64 target is installed alongside the native host target.
          - { name: macos, os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: linux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Package all plugins
        run: |
          # Build and bundle every package listed in bundler.toml in one go
          package_args=()
          for package in $(cargo xtask known-packages); do
            package_args+=("-p" "$package")
          done

          if [[ "${{ matrix.name }}" == "macos" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            cargo xtask bundle-universal "${package_args[@]}" --release
          else
            cargo xtask bundle "${package_args[@]}" --release --target "${{ matrix.target }}"
          fi

      - name: Create archive
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            tar -cf "dist/dizmo-${{ matrix.name }}.tar" -C target/bundled .
          else
            tar -czf "dist/dizmo-${{ matrix.name }}.tar.gz" -C target/bundled .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dizmo-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Build and bundle the DIZMO Editor standalone app for macOS, Windows and
  # Linux (AppImage). Artifacts are only generated when a version tag is pushed.
  editor-package:
    name: Editor ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: both architectures are merged into a universal binary.
          # CI runners are ARM64, so the x86_64 target is installed alongside.
          - { name: macos, os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: linux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Build editor (macOS universal)
        if: runner.os == 'macOS'
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.13
          cargo build --release --target aarch64-apple-darwin -p dizmo_editor
          cargo build --release --target x86_64-apple-darwin -p dizmo_editor
          mkdir -p target/editor
          lipo -create \
            target/aarch64-apple-darwin/release/dizmo_editor \
            target/x86_64-apple-darwin/release/dizmo_editor \
            -output target/editor/dizmo_editor

      - name: Build editor (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p dizmo_editor

      - name: Build editor (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p dizmo_editor

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          ARCH: x86_64
        run: |
          set -euo pipefail
          mkdir -p dist
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          # CI has no FUSE: extract the AppImages instead of mounting them.
          # linuxdeploy finds the plugin on PATH under its exact name.
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null
          mv squashfs-root ld-root
          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract > /dev/null
          mv squashfs-root plugin-root
          export PATH="$PWD/ld-root/usr/bin:$PWD/plugin-root/usr/bin:$PATH"
          mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/${{ matrix.target }}/release/dizmo_editor AppDir/usr/bin/
          cp packaging/dizmo-editor.desktop AppDir/usr/share/applications/
          cp packaging/dizmo-editor.png AppDir/usr/share/icons/hicolor/512x512/apps/
          cp packaging/dizmo-editor.png AppDir/.DirIcon
          # The output AppImage is named after the AppDir directory.
          mv AppDir DIZMO_Editor.AppDir
          linuxdeploy-x86_64 --appdir DIZMO_Editor.AppDir \
            --desktop-file DIZMO_Editor.AppDir/usr/share/applications/dizmo-editor.desktop \
            --icon-file DIZMO_Editor.AppDir/usr/share/icons/hicolor/512x512/apps/dizmo-editor.png \
            --output appimage
          mv DIZMO_Editor-x86_64.AppImage dist/dizmo-editor-linux.AppImage

      - name: Create archive
        if: runner.os != 'Linux'
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/dizmo_editor.exe dist/
            (cd dist && tar -cf "dizmo-editor-windows.tar" dizmo_editor.exe)
          else
            cp target/editor/dizmo_editor dist/
            tar -czf "dizmo-editor-macos.tar.gz" -C dist dizmo_editor
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dizmo-editor-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Attach the bundles to a GitHub Release for the pushed version tag. This
  # runs only after all platform bundles are built and uploaded.
  release:
    name: Publish release
    needs: [package, editor-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
